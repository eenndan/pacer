# pytest here is for LOCAL iteration on one test: `pixi run python -m pytest tests/test_x.py -k name`.
# CTest does not run it: each file's own `__main__` runner is still the gate (ARCH-7; the numbers
# are in studio/docs/refused-2026-09.md §18). tests/conftest.py makes such a run jailed and faithful.
[pytest]
# The rule every `globals()` runner here enumerates with (`k.startswith("test_")`), so pytest and
# the runner collect one set. tests/test_layering.py holds the two to the same tests.
python_functions = test_*
# -p no:logging: pytest's log capture keeps every LogRecord (with its exc_info traceback, and so
#   every object the failing frame held) alive until the test's report. Measured 2026-09-25:
#   test_load_affordances's leak check then counts 5 unreleased SessionLoadWorker QThreads
#   (1 -> 6) that the script run does not have.
# -p no:cacheprovider: no .pytest_cache directory in the tree.
addopts = -p no:logging -p no:cacheprovider
