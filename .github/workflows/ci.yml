name: CI

on:
  # main-only push trigger: PR branches are already covered by pull_request, so an
  # unrestricted push trigger would run every PR's CI twice.
  push:
    branches: [main]
    tags: ['v*']          # a release tag re-runs the required job, soak included (the release step)
  pull_request:
  workflow_dispatch:      # a manual run carries the soak, the lock notice and next-runner below
  # WEEKLY, ON MAIN (Mondays 05:23 UTC). A showcase is read months after its last push, and a lock,
  # a runner image or a download can rot with no commit at all, so the required job below re-runs
  # in full every week, soak included, and `next-runner` tries the newest macOS image.
  # - GitHub DISABLES a public repo's schedule after 60 days without a commit (the Actions tab
  #   re-enables it), so this covers about two months past the last push, not "months later".
  # - The pixi cache is evicted after 7 days unused, so a run after a quiet week installs the lock
  #   COLD from the channels: the fresh-clone path.
  # - A scheduled run's check suite attaches to main's HEAD commit, so a red weekly run (a
  #   next-runner failure, a soak flake, a rotted lock) shows as a failed check on the public
  #   repo's latest commit; GitHub notifies whoever last changed the cron line below.
  schedule:
    - cron: "23 5 * * 1"

# Cancel an in-progress run when a newer commit is pushed to the same ref. The event is part of the
# group so a weekly run on main and a push to main never cancel each other; a pull request's event
# is always `pull_request`, so its runs still replace each other.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build-test-lint:
    name: build + test + lint (macos-14 / arm64)
    # macos-14 is Apple-silicon (arm64) — matches the project's only pixi platform (osx-arm64).
    runs-on: macos-14
    # Hard ceiling for the whole job: a clean run finishes in a few minutes (cold pixi cache
    # included), so anything past this is a hang — fail fast, never burn the 6-hour default.
    timeout-minutes: 20
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v5
        with:
          # gpmf-parser and nanobind are git submodules the C++ build needs.
          submodules: recursive
          # 2, not 1: a pull request checks out its merge commit, and the changelog rule below
          # diffs that against its first parent (the base branch it merges into).
          fetch-depth: 2

      - name: "Changelog: a PR adds a changes/ fragment; only a release PR edits CHANGELOG.md (title starts with 'release', or it deletes the changes/ fragments it folds)"
        # Fragments exist so parallel PRs stop colliding in CHANGELOG.md (F1). Fails in seconds,
        # before any build. The title reaches the script through env, never spliced into it.
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if git diff --quiet HEAD^1 HEAD -- CHANGELOG.md; then
            echo "CHANGELOG.md untouched"; exit 0
          fi
          case "$(printf '%s' "$TITLE" | tr '[:upper:]' '[:lower:]')" in
            release*) echo "release PR (title): CHANGELOG.md may change"; exit 0 ;;
          esac
          if [ -n "$(git diff --name-only --diff-filter=D HEAD^1 HEAD -- changes/)" ]; then
            echo "folds changes/ fragments: CHANGELOG.md may change"; exit 0
          fi
          echo "::error file=CHANGELOG.md::This PR edits CHANGELOG.md directly. Add a changes/ fragment instead; only a release PR (title starting 'release', or one that deletes the changes/ fragments it folds in) edits CHANGELOG.md."
          exit 1

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.9.6
        with:
          # Pin pixi itself for reproducible CI (matches the committed pixi.lock).
          pixi-version: v0.70.1
          # `locked: true` (the default when pixi.lock is present) installs exactly the lockfile.
          cache: true

      - name: Build (cmake --build via pixi)
        run: pixi run build

      - name: Bindings regen drift gate
        # The committed generated files must match what the locked litgen/black produce from the
        # committed headers. The build's codegen runs only when its inputs change
        # (bindings/pacer/CMakeLists.txt), so this step REGENERATES UNCONDITIONALLY first: the gate
        # must not rest on the build's dependency tracking, a warm build dir or file mtimes.
        run: |
          pixi run gen-bindings
          git diff --exit-code -- bindings/

      # Lint and format run BEFORE the tests: each takes about a second, while the test step takes
      # minutes, so a lint error fails the run in about a minute instead of after the whole suite.
      - name: Lint (ruff check via pixi)
        run: pixi run lint

      - name: Format check (clang-format --dry-run --Werror via pixi)
        # Non-mutating gate over the hand-maintained C/C++ files with the env-pinned
        # clang-format (the generated nanobind_pacer.cpp is excluded — owned by the
        # regen-drift gate above).
        run: pixi run fmt-check

      - name: Type check (pyright on the Qt-free core allow-list via pixi)
        # A few seconds, like lint. pyrightconfig.json holds the module list and its ratchet
        # (tests/test_typecheck_config.py pins both). It reads the committed binding stubs, which
        # the drift gate above has just matched to the headers.
        run: pixi run typecheck

      - name: Test (ctest via pixi)
        env:
          # The compare-toggle crash soak (`soak.*`, LABELS soak) runs on pushes to main, tags,
          # manual runs and the weekly schedule, inside this same step: started first by its
          # COST, it runs beside the rest of the suite. On a pull request it is reported Skipped
          # by name, and the deterministic guard for its root cause runs instead
          # (tests/test_compare_lifecycle.py).
          PACER_SOAK: ${{ github.event_name != 'pull_request' && '1' || '' }}
        run: pixi run test

      - name: E2E smoke (full StudioWindow offscreen on the bundled GoPro sample)
        # Builds the whole app against 3rdparty/gpmf-parser/samples/hero6.mp4 (checked out with
        # the submodules) — catches load-pipeline regressions the unit tests can't see.
        # --no-video swaps PlayerPane's QMediaPlayer/QAudioOutput/QVideoWidget for inert
        # stand-ins (the PACER_NO_MEDIA seam in studio/player_pane.py): the runner is a headless
        # VM with no media/audio devices, where opening the real ffmpeg/AVFoundation pipeline
        # blocks forever (a previous run hung 27+ min here). Everything the smoke gates — the
        # full Session load, panel construction, sidecar write — still runs. Locally this
        # finishes in seconds, so the 5-min step timeout is pure hang headroom.
        #
        # NO PYTHONPATH, and through the `smoke` task: this runner's env is as fresh as a new
        # clone's, so the step starts Python the way `pixi run studio` does and fails when the
        # README's command would. It used to point PYTHONPATH at bindings/pacer, and stayed green
        # while `pixi run studio -- --demo` failed on every fresh clone (EVAL-1, 2026-09-26). The
        # build now deploys the whole package into site-packages (bindings/pacer/CMakeLists.txt).
        timeout-minutes: 5
        run: QT_QPA_PLATFORM=offscreen pixi run smoke

      - name: Demo asset reachable (non-blocking)
        # `--demo` downloads the synthetic demo session (studio/demo.py `_DEMO_URL`) and keeps it
        # only if its sha256 is `_DEMO_SHA256`. This step runs THAT fetch — the app's own function,
        # URL, timeout and checksum — into a throwaway directory, so the warning cannot drift from
        # what `pixi run studio -- --demo` would do (it used to probe its own copy of the URL). It is
        # NON-BLOCKING (continue-on-error): a missing or re-uploaded asset is a release-page problem,
        # not a code one, stated on every run until fixed. tests/test_demo.py holds this shape.
        continue-on-error: true
        run: |
          if pixi run python -c 'import os, sys, tempfile; from studio import demo; sys.exit(0 if demo._try_download_demo(os.path.join(tempfile.mkdtemp(), "demo.mp4")) else 1)'; then
            echo "demo asset OK"
          else
            echo "::warning::demo asset unreachable or not the pinned file — 'pixi run studio -- --demo' will fail until the demo-data release carries it (studio/demo.py _DEMO_URL / _DEMO_SHA256)"
          fi

      - name: Lock freshness (weekly schedule / manual, non-blocking)
        # The prompt for the next quarterly lock refresh (LONGEVITY-4, 2026-09-30): how many locked
        # packages have a newer release inside pyproject.toml's ranges, as a notice on the run. A
        # dry run solves within the manifest, so a package it holds (python <3.14, nanobind <2.8)
        # never shows here. `--dry-run --no-install` writes neither pixi.lock nor the env. LAST in
        # the job on purpose: it can never run before the build or the tests, and a solver or
        # network hiccup here is not a code problem (continue-on-error). A manual run takes it
        # too, so a change to it can be tried on the runner before a Monday finds it broken.
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: |
          pixi update --dry-run --no-install --json > "$RUNNER_TEMP/pixi-update.json"
          pixi run python -c '
          import json, sys
          d = json.load(open(sys.argv[1]))
          names = sorted({r["name"] for env in d.get("environment", {}).values()
                          for rows in env.values() for r in rows})
          listed = (": " + ", ".join(names)) if names else ""
          print(f"::notice title=pixi.lock::{len(names)} locked packages have a newer release"
                f" inside pyproject.toml ranges{listed}")
          ' "$RUNNER_TEMP/pixi-update.json"

  next-runner:
    name: next runner early warning (macos-latest; schedule / manual)
    # The required job above runs on macos-14, and GitHub retires images. This job runs the build,
    # the smoke and the golden gate on macos-latest, the image that job will have to move to, so a
    # new Xcode clang or a new image breaks HERE, weekly, before it breaks every pull request. It
    # never runs on a pull request and is not a required check (the ruleset requires the job
    # above by its exact name, so that job is never renamed or turned into a matrix), so it can
    # never block a merge.
    # No continue-on-error, deliberately: it would make the scheduled run conclude success when
    # this job fails, and the warning would reach no one. A failure here turns the weekly run red,
    # a failed check on main's HEAD commit (see `schedule:` above): that IS the warning.
    # It shares the required job's setup-pixi cache key (same lock), so one of the two may warn
    # "Unable to reserve cache ... another job may be creating this cache". That is harmless:
    # both install the same lock, and each builds from an empty build dir.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.9.6
        with:
          pixi-version: v0.70.1
          cache: true
      - name: Build (cmake --build via pixi)
        run: pixi run build
      - name: E2E smoke (full StudioWindow offscreen on the bundled GoPro sample)
        timeout-minutes: 5
        run: QT_QPA_PLATFORM=offscreen pixi run smoke
      - name: Golden equivalence gate (synthetic)
        run: pixi run golden
