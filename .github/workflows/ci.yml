name: CI

on:
  # main-only push trigger: PR branches are already covered by pull_request, so an
  # unrestricted push trigger would run every PR's CI twice.
  push:
    branches: [main]
    tags: ['v*']          # a release tag also fires the packaging smoke below
  pull_request:
  workflow_dispatch:      # manual trigger for the (slow) packaging smoke

# Cancel an in-progress run when a newer commit is pushed to the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-lint:
    name: build + test + lint (macos-14 / arm64)
    # macos-14 is Apple-silicon (arm64) — matches the project's only pixi platform (osx-arm64).
    runs-on: macos-14
    # Hard ceiling for the whole job: a clean run finishes in a few minutes (cold pixi cache
    # included), so anything past this is a hang — fail fast, never burn the 6-hour default.
    timeout-minutes: 20
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v5
        with:
          # gpmf-parser and nanobind are git submodules the C++ build needs.
          submodules: recursive
          # 2, not 1: a pull request checks out its merge commit, and the changelog rule below
          # diffs that against its first parent (the base branch it merges into).
          fetch-depth: 2

      - name: "Changelog: a PR adds a changes/ fragment; only a release PR edits CHANGELOG.md (title starts with 'release', or it deletes the changes/ fragments it folds)"
        # Fragments exist so parallel PRs stop colliding in CHANGELOG.md (F1). Fails in seconds,
        # before any build. The title reaches the script through env, never spliced into it.
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if git diff --quiet HEAD^1 HEAD -- CHANGELOG.md; then
            echo "CHANGELOG.md untouched"; exit 0
          fi
          case "$(printf '%s' "$TITLE" | tr '[:upper:]' '[:lower:]')" in
            release*) echo "release PR (title): CHANGELOG.md may change"; exit 0 ;;
          esac
          if [ -n "$(git diff --name-only --diff-filter=D HEAD^1 HEAD -- changes/)" ]; then
            echo "folds changes/ fragments: CHANGELOG.md may change"; exit 0
          fi
          echo "::error file=CHANGELOG.md::This PR edits CHANGELOG.md directly. Add a changes/ fragment instead; only a release PR (title starting 'release', or one that deletes the changes/ fragments it folds in) edits CHANGELOG.md."
          exit 1

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.9.6
        with:
          # Pin pixi itself for reproducible CI (matches the committed pixi.lock).
          pixi-version: v0.70.1
          # `locked: true` (the default when pixi.lock is present) installs exactly the lockfile.
          cache: true

      - name: Build (cmake --build via pixi)
        run: pixi run build

      - name: Bindings regen drift gate
        # The build regenerates the bindings glue/stubs in-place (bindings/pacer/CMakeLists.txt),
        # so the committed generated files must match what the locked litgen/black produce.
        run: git diff --exit-code -- bindings/

      # Lint and format run BEFORE the tests: each takes about a second, while the test step takes
      # minutes, so a lint error fails the run in about a minute instead of after the whole suite.
      - name: Lint (ruff check via pixi)
        run: pixi run lint

      - name: Format check (clang-format --dry-run --Werror via pixi)
        # Non-mutating gate over the hand-maintained C/C++ files with the env-pinned
        # clang-format (the generated nanobind_pacer.cpp is excluded — owned by the
        # regen-drift gate above).
        run: pixi run fmt-check

      - name: Type check (pyright on the Qt-free core allow-list via pixi)
        # A few seconds, like lint. pyrightconfig.json holds the module list and its ratchet
        # (tests/test_typecheck_config.py pins both). It reads the committed binding stubs, which
        # the drift gate above has just matched to the headers.
        run: pixi run typecheck

      - name: Test (ctest via pixi)
        env:
          # The compare-toggle crash soak (`soak.*`, LABELS soak) runs on pushes to main, tags and
          # manual runs, inside this same step: started first by its COST, it runs beside the rest
          # of the suite. On a pull request it is reported Skipped by name, and the deterministic
          # guard for its root cause runs instead (tests/test_compare_lifecycle.py).
          PACER_SOAK: ${{ github.event_name != 'pull_request' && '1' || '' }}
        run: pixi run test

      - name: E2E smoke (full StudioWindow offscreen on the bundled GoPro sample)
        # Builds the whole app against 3rdparty/gpmf-parser/samples/hero6.mp4 (checked out with
        # the submodules) — catches load-pipeline regressions the unit tests can't see.
        # --no-video swaps PlayerPane's QMediaPlayer/QAudioOutput/QVideoWidget for inert
        # stand-ins (the PACER_NO_MEDIA seam in studio/player_pane.py): the runner is a headless
        # VM with no media/audio devices, where opening the real ffmpeg/AVFoundation pipeline
        # blocks forever (a previous run hung 27+ min here). Everything the smoke gates — the
        # full Session load, panel construction, sidecar write — still runs. Locally this
        # finishes in seconds, so the 5-min step timeout is pure hang headroom.
        timeout-minutes: 5
        env:
          # Same rationale as the ctest registration (tests/CMakeLists.txt): with no pip install
          # of `pacer` in the fresh CI env, a bare `python -m` from the repo root resolves
          # `import pacer` to the C++ source dir as an EMPTY namespace package. Point the
          # interpreter at the cmake-deployed bindings package explicitly.
          PYTHONPATH: ${{ github.workspace }}/bindings/pacer
        run: QT_QPA_PLATFORM=offscreen pixi run python -m studio.dev._smoke --no-video

      - name: Demo asset reachable (non-blocking)
        # `--demo` downloads the synthetic demo session (studio/demo.py `_DEMO_URL`) and keeps it
        # only if its sha256 is `_DEMO_SHA256`. This step runs THAT fetch — the app's own function,
        # URL, timeout and checksum — into a throwaway directory, so the warning cannot drift from
        # what `pixi run studio -- --demo` would do (it used to probe its own copy of the URL). It is
        # NON-BLOCKING (continue-on-error): a missing or re-uploaded asset is a release-page problem,
        # not a code one, stated on every run until fixed. tests/test_demo.py holds this shape.
        continue-on-error: true
        run: |
          if pixi run python -c 'import os, sys, tempfile; from studio import demo; sys.exit(0 if demo._try_download_demo(os.path.join(tempfile.mkdtemp(), "demo.mp4")) else 1)'; then
            echo "demo asset OK"
          else
            echo "::warning::demo asset unreachable or not the pinned file — 'pixi run studio -- --demo' will fail until the demo-data release carries it (studio/demo.py _DEMO_URL / _DEMO_SHA256)"
          fi

  package-smoke:
    name: package .app build-only smoke (tag / manual)
    # A full PyInstaller build is slow and only matters at release, so this runs ONLY on a version
    # tag or a manual dispatch — never on a PR. BUILD-ONLY: it does NOT launch the .app (the app
    # blocks in exec(), it would hang) and does NOT build/upload a .dmg — it just proves the bundle
    # is well-formed, so spec rot (a hidden-import miss, a datas typo, a dropped QtMultimedia plugin)
    # can't ship a .app that crashes on launch with the rest of CI green.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.9.6
        with:
          pixi-version: v0.70.1
          cache: true
      - name: Build the C++ core + bindings
        run: pixi run build
      - name: Build the .app (PyInstaller — no .dmg)
        # Same rationale as the ctest/smoke PYTHONPATH: point `import pacer` at the cmake-deployed
        # bindings package so the spec bundles the real _pacer.so on a fresh CI env.
        #
        # ensurepip first: `pip` is NOT in [tool.pixi.dependencies], so a fresh env solved from the
        # lockfile has no pip and `python -m pip install` dies with "No module named pip". A dev box
        # hides this — the editable install pulls pip in — which is why it survived review. This job
        # only runs on a v* tag or a manual dispatch, and there had been NO tag since the job was
        # added, so the very first time it ever executed was v0.2.0, where it failed on this line.
        # Bootstrapping keeps PyInstaller opt-in (docs/PACKAGING.md: "intentionally not a project
        # dependency") rather than adding it to the env for everyone.
        env:
          PYTHONPATH: ${{ github.workspace }}/bindings/pacer
        run: |
          pixi run python -m ensurepip --upgrade
          pixi run python -m pip install pyinstaller
          pixi run pyinstaller --noconfirm --clean packaging/pacer.spec
      - name: Assert the .app bundle is well-formed
        run: |
          APP="dist/Pacer Studio.app"
          test -d "$APP" || { echo "::error::PyInstaller produced no $APP"; exit 1; }
          find "$APP/Contents/MacOS" -maxdepth 1 -type f -perm +111 | grep -q . \
            || { echo "::error::no executable in $APP/Contents/MacOS"; exit 1; }
          find "$APP" -name '_pacer*.so' | grep -q . \
            || { echo "::error::the compiled _pacer core is missing from the bundle"; exit 1; }
          find "$APP" -name 'ffmpeg' | grep -q . \
            || { echo "::error::ffmpeg is missing from the bundle (video export would break)"; exit 1; }
          echo "bundle OK ($(du -sh "$APP" | cut -f1))"
