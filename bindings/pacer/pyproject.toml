[project]
authors = [{ name = "eenndan" }]
dependencies = ["litgen @ git+https://github.com/pthom/litgen@b83e0ca75952031dbab328e230ff866f8076d14a"]
description = "Python bindings for the pacer C++ telemetry core"
name = "pacer"
requires-python = ">= 3.11"
# Keep in lockstep with studio/__init__.py __version__ (canonical) and the root pyproject.toml.
# Pinned by tests/test_version.py.
version = "0.5.1"

# `pixi install` builds this editable package in an isolated env whose requirements are resolved
# from PyPI at install time and are NOT in pixi.lock. With the backend below commented out, the
# setuptools legacy backend is what runs, and it needs setuptools alone: the compiled module comes
# from the CMake build (`pixi run build`), never from this step. The four requires this list once
# held pulled 16 unlocked packages on every fresh clone (scikit-build-core, nanobind 3.x, PyPI's
# litgen with black and srcml-caller; `pixi install -vv`, 2026-09-30), none of them used.
[build-system]
requires = ["setuptools"]
# build-backend = "scikit_build_core.build"

[tool.pixi.project]
channels = ["conda-forge"]
platforms = ["osx-arm64"]

[tool.setuptools.package-data]
pacer = ["*.so", "*.pyd", "**/*.pyi"]

[tool.setuptools]
packages = ["pacer"]

