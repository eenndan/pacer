[project]
authors = [{ name = "eenndan" }]
dependencies = ["litgen @ git+https://github.com/pthom/litgen@b83e0ca75952031dbab328e230ff866f8076d14a"]
description = "Race-telemetry analysis studio (GoPro GPS/IMU → laps, deltas, synced video)"
license = { text = "CC BY-NC-SA 4.0" }
name = "pacer"
requires-python = ">= 3.11"
# Keep in lockstep with studio/__init__.py __version__ (canonical) and bindings/pacer/pyproject.toml
# — packaging/build_macos.sh names the .dmg from THIS line. Pinned by tests/test_version.py.
version = "0.5.1"

[build-system]
requires = ["scikit-build-core >=0.10", "nanobind >=1.3.2", "litgen"]
build-backend = "scikit_build_core.build"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64"]

[tool.pixi.pypi-dependencies]
pacer = { path = "bindings/pacer", editable = true }
# `studio` desktop app (PySide6 + pyqtgraph). See studio/.
pyside6 = ">=6.8"
pyqtgraph = ">=0.13"
# Phosphor (+ other) icon fonts as QIcons; works with PySide6 via QtPy. See studio/theme.icon.
qtawesome = ">=1.3"
# litgen's own dependency, named here only to hold its major line (see `python` below).
nanobind = ">=2.7,<3"

[tool.pixi.tasks]
# `configure` sets up a MISSING build dir and leaves an existing one alone: `cmake --build` re-runs
# cmake by itself when a CMakeLists.txt, a cmake module or a CONFIGURE_DEPENDS glob changes, so an
# unconditional configure bought nothing and cost every `pixi run build` — and so every `pixi run
# studio`, which depends on it — ~340 ms. With the bindings codegen and the .so copies now running
# only when their inputs change (bindings/pacer/CMakeLists.txt), a no-op build is ninja saying
# "no work to do" (HEALTH-1, 2026-09-25: 1.5-3.5 s before). To force a fresh configure, delete
# build/Release.
configure = "test -f build/Release/build.ninja || cmake -S . -B build/Release -G Ninja"
build = { cmd = "cmake --build build/Release", depends-on = ["configure"] }
# WHY BOTH ctest TASKS ARE RUN UNDER `caffeinate -si`.
#
# A suite run is minutes of no keyboard, no mouse, no display — exactly the shape of an idle
# machine. If the Mac sleeps mid-run, the test that happens to be in flight is FROZEN, and ctest's
# own timeout is measured on a clock that keeps counting through sleep: on the next wake ctest sees
# an overdue deadline, kills the test immediately, and reports a duration equal to the SLEEP, not
# the limit. Measured here 2026-09-12 on an unattended `pixi run test-fast` (--timeout 120):
#
#   pmset sleep 01:10:02, 942 s   ->  test_import_ergonomics  ***Timeout  946.07 sec
#   pmset sleep 01:26:30, 542 s   ->  test_load_failure       ***Timeout  542.21 sec
#   pmset sleep 01:38:32, 988 s   ->  test_export_pill_budget ***Timeout 1003.62 sec
#
# Three "hangs", one per sleep, each matching its sleep to the second — while the same three tests
# pass in 0.6 s / 3.7 s / 16.6 s when run on an awake machine. The signature is nasty because it
# reads like a product deadlock and is not one: the victim is whichever test is running when the
# machine drops, so the set changes every run; a test can print its own final "all tests passed"
# line and still be killed (it froze between the last flush and process exit); and the reported
# time is always far past `--timeout`, which makes ctest itself look broken. It is not — verified
# against a sleeping-, a CPU-burning-, a chatty- and a leaked-grandchild test, all killed within
# 0.1 s of a 3 s limit on an awake machine (3.02-3.10 s).
#
# `-i` stops the machine idle-sleeping in the first place; `-s` additionally holds it awake once it
# is in a PowerNap DarkWake window (those windows are capped at 45-180 s and close underneath a
# running test — a plain NoIdleSleep assertion does not keep one open). `-s` needs AC power and is
# a no-op on battery, which is why both flags are here rather than either alone. The assertion
# lives exactly as long as the ctest child. `golden` is deliberately NOT wrapped: it carries no
# --timeout, so a sleep makes it slow rather than red.
#
# --timeout 480: a per-test ceiling well under CI's 20-min job cap, with headroom over the one
# legitimately-slow test (test_export_video, ~110 s ffmpeg encode). A hang dies at 8 min instead
# of eating the whole job, and a ctest timeout FLUSHES the test's buffered output (with
# --output-on-failure), surfacing the in-test faulthandler watchdog dump instead of an opaque
# 20-min job cancel that shows nothing (what made the C1 off-thread-load CI hang diagnosable).
# The `footage.*` registrations carry their own TIMEOUT (3600 s, tests/CMakeLists.txt), which
# --timeout does not override. On the dev Mac they run here on the Desktop working set (G2); in CI
# there is no footage and each is reported Skipped by name.
#
# BOTH ctest TASKS RUN FOUR TESTS AT ONCE (CTEST_PARALLEL_LEVEL in each task's env). Until
# 2026-09-23 they ran one at a time — one core of an 8-core M1 Pro — while test-fast grew from 29 s
# (early August) to ~420 s. Measured that day on test-fast, 135 tests, ctest's own totals:
#
#   serial 420 s    -j4 143 s    -j8 104 s (test_stats 104 s against the old --timeout 120)
#   -j6 94 s, on the commit before
#   two lanes at once:  -j4 227 / 242 s, green (about half of it under load ~20 from exports)
#                       -j8 192 / 206 s, four ***Timeout (test_stats, test_pb_toast,
#                           test_central_view_realqt)
#
# WHY FOUR, NOT EVERY CORE. The M1 Pro is 6 performance + 2 efficiency cores. Past ~6 busy processes
# the long single-threaded suites land on an efficiency core and take twice as long — test_stats is
# ~56 s of one core's CPU at any level (measured: it is not BLAS threading). And agent lanes
# overlap: in September two suites ran at once for a quarter of all suite time. Four keeps one lane
# on performance cores and two lanes at the eight processes one -j8 lane survives. CI's macos-14
# runner has 3 cores, where four is a mild oversubscription, not a failure mode.
#
# WHY A VARIABLE, NOT -j. ctest 4 rejects a second -j ("'-j' given invalid value '4 -j2'"), so a -j
# in the task would make `pixi run test-fast -j1` an error. The variable is only a default and one
# appended -jN wins: `-j1` for a serial run when you need to rule an interaction out, `-j6` when you
# know the machine is yours. tests/test_parallel_suite.py pins both halves.
#
# WHY IT IS SAFE. Every test process resolves its own app-support jail (studio/app_support.py), no
# test builds a fixed path in the shared $TMPDIR (tests/test_temp_isolation.py), and the footage
# checks share RESOURCE_LOCK footage (tests/CMakeLists.txt), so those ffmpeg-heavy checks still run
# one at a time, beside the light suites.
test = { cmd = "caffeinate -si ctest --test-dir build/Release --output-on-failure --timeout 480", depends-on = ["build"], env = { CTEST_PARALLEL_LEVEL = "4" } }
# Fast inner loop for agents: the full suite minus the two slow tests. Run this while iterating,
# `test` before a PR.
#
# THE EXCLUSION LIST HAS TO BE RE-MEASURED, NOT ASSUMED — AND IT HAS NOW ROTTED TWICE. It first
# named test_export_video alone and described it as "~110 s ffmpeg encode, ~18 s for the other 45".
# The 2026-09-07 re-measure replaced that with a table which has itself gone stale in every row:
# it recorded test_export_video at 10.3 s and concluded the exclusion had "become the SIXTH slowest
# test, while the actual outlier was not excluded at all". Measured 2026-09-16, that conclusion is
# now backwards — the two excluded suites are the two slowest, in that order:
#
#   test_export_video       112.0 s     test_export_pill_budget   17.8 s
#   test_compare_lifecycle  104.3 s     test_load_lifecycle       15.0 s
#   test_stats               48.7 s     test_charts_header_budget 14.9 s
#   test_pb_toast            25.3 s     test_first_run_path       13.0 s
#   test_central_view_realqt 22.8 s     test_welcome_first_touch  12.7 s
#   ...then a long tail; whole suite 528 s over 114 tests
#
# test_export_video went 10.3 -> 112.0 s because its real-media cases came back; the `--timeout 480`
# note above already says ~110 s and is the row that stayed true. Read every number here as a
# measurement with a DATE on it, not as a standing fact.
#
# Be honest about what this buys: excluding both leaves 112 tests in ~307 s (serial run, 307.0 s,
# 2026-09-16). That is about 42 % off, not the ~18 s the original comment promised — the remaining
# time is spread thin across offscreen-Qt suites that each build a real StudioWindow, and there is
# no single test left worth cutting. Do not add exclusions to chase a number; re-measure and update
# this table instead.
#
# test_compare_lifecycle's crash SOAK is expensive on purpose and must NOT be trimmed: it is the
# probabilistic guard for a SIGSEGV (a live widget half-moved between layouts), and a crash cannot be
# asserted in-process — it runs 3 subprocesses x 1500 enter/exit cycles, a count sized by
# measurement (600 cycles killed 4 of 6 processes; 1500 killed 6 of 6). Since 2026-09-24 it is its
# own registration, `soak.test_toggle_compare_repeatedly_does_not_crash`, which runs where
# PACER_SOAK=1 (`test-soak` below, and CI on pushes to main and tags) and is reported Skipped by
# name everywhere else, here included. What stays on every PR is the file's deterministic guard,
# which fails in 22 ms when the root cause is put back. That registration is still excluded here as
# it always was, though it now takes ~1 s: re-measure before changing the list, as above.
#
# THE `footage.*` REGISTRATIONS ARE REPORTED, NOT RUN, HERE (G2). Since their defaults name the
# Desktop working set, on the dev Mac all fourteen really run, and measured 2026-09-23 they cost
# 139-151 s on top of this loop's 372 s (+40 %, both serial), warm page cache: one alone
# re-encodes a whole lap twice (`…_render_quality_levels…`, 67-80 s). So this task sets
# PACER_FOOTAGE_DEFAULTS=off, and each is reported Skipped BY NAME with a reason that says where it
# runs — a gate report can quote that list, and nothing reads as a pass.
# They are not excluded with `-E`/`-LE`: an excluded test vanishes from the output, and a check
# that cannot run has to say so (#341). A variable you SET (PACER_GOLDEN_MP4, …) still runs its
# checks here, past --timeout on their own TIMEOUT property (tests/CMakeLists.txt). `test` above
# runs them all with everything else — the pre-PR gate is where real footage belongs — and
# `test-footage` below runs only them.
#
# --timeout 480, the same ceiling as `test`, not the 120 it had while serial. Measured 2026-09-23:
# test_stats, 48 s on a quiet machine, took 136-144 s run ALONE while other lanes rendered footage
# (load ~20) — past 120 s with no parallelism at all — 92-106 s in two -j4 lanes, and 265 s at -j4
# under that same load. 480 s is ~1.8x the worst legitimate run. A hang costs no more than it did:
# it holds one of four slots while the rest of the loop finishes, so a run that meets one ends at
# ~8 min, where a serial run paid 2 min for the hang plus ~7 min for everything else.
test-fast ={ cmd = "caffeinate -si ctest --test-dir build/Release --output-on-failure --timeout 480 -E 'test_export_video|test_compare_lifecycle'", depends-on = ["build"], env = { PACER_FOOTAGE_DEFAULTS = "off", CTEST_PARALLEL_LEVEL = "4" } }
# Just the real-footage checks (`LABELS footage`, tests/CMakeLists.txt), on their working-set
# defaults or the recordings your variables name (tests/_footage.py). No --timeout: each carries
# its own TIMEOUT. On a machine without the footage every one is reported Skipped, by name.
test-footage = { cmd = "caffeinate -si ctest --test-dir build/Release --output-on-failure -L footage", depends-on = ["build"] }
# Just the soaks (`LABELS soak`, tests/CMakeLists.txt): probabilistic checks too slow for every PR,
# each beside a deterministic guard that does run there. PACER_SOAK=1 is what makes one run;
# without it (`test`, `test-fast`, CI on a pull request) each is reported Skipped by name. CI sets
# it on pushes to main and on tags (.github/workflows/ci.yml). No --timeout: each has a TIMEOUT.
test-soak = { cmd = "caffeinate -si ctest --test-dir build/Release --output-on-failure -L soak", depends-on = ["build"], env = { PACER_SOAK = "1" } }
# TWO OPTIONAL INNER LOOPS, NEITHER A GATE: `test` stays the pre-PR gate and `test-fast` the loop.
# Each is an anchored list of registrations; tests/test_parallel_suite.py fails a name that is not a
# tests/<name>.py (a misspelt or renamed one would otherwise select nothing and still exit 0), and
# neither carries -j or caffeinate: a run of seconds, started from the keyboard, like `golden`.
#
# `test-core`, between edits to the core math (TEETH-6). The 2026-09-28 review planted 34 defects in
# timing, geometry, delta, stats and the stores; the whole suite killed 31 then. PROCESS-10 re-ran
# them on 2026-09-30 (3bebf57): all 34 die, and these eleven registrations alone kill every one.
# The greedy cover is nine of them. test_focus_list stays although test_measured_figures also kills
# M11: it is test-core's only behaviour test that does. 16.3 s wall at -j4 on 2026-09-28, load 4
# (test_stats 16.3, golden 10.3, measured_figures 8.2); 37-44 s at load 19-20 beside other lanes
# (2026-09-29), test_stats the long pole each time. It is FITTED to those 34 mutants: a green run
# says nothing about a defect they do not model, so `test` stays the gate. Re-derived whenever the
# mutation run is (PROCESS-10); a changed cover is this one regex. test_measured_figures runs only
# its non-footage checks here (PACER_FOOTAGE_DEFAULTS=off, as in `test-fast`). The eleventh rides
# along outside the cover: test_truth_matrix (TRUTH-1/-2) holds every number above the core to the
# synthetic GoPro's ground truth (on 09-30 it killed 4 of the 34, none alone). It starts first by
# its COST and runs beside test_stats (16.3 s alone at load ~20, 2026-09-29), so it adds little to
# the wall.
test-core = { cmd = "ctest --test-dir build/Release --output-on-failure --timeout 480 -R '^(test_golden_synthetic|test_lap_closure|test_library|test_export_data|test_session_pure|test_stats|test_focus_list|test_jsonstore|test_measured_figures|test_sector_integrity|test_truth_matrix)$'", depends-on = ["build"], env = { PACER_FOOTAGE_DEFAULTS = "off", CTEST_PARALLEL_LEVEL = "4" } }
# `test-ciworld`, before pushing a player or compare change (DELIVERY-6): CI's software-decode world
# (no VideoToolbox, so Qt's FFmpeg backend decodes on the CPU) over the registrations that build a
# REAL QMediaPlayer: every test file that pops PACER_NO_MEDIA outside its footage checks
# (test_parallel_suite holds the list to exactly those; test_video_view_compare pops it only in its
# footage check, which CI never runs, so its registration is the inert triplet and is not here).
# Timing differs there: under software decode a fresh pane's paused frame reached the sink 44 ms
# after the click, where VideoToolbox took 361 ms, and a test that hooked the sink in between passed
# here and failed only in CI (367b3ed). With that fix reverted, this task failed 4 of 6 runs and the
# plain registration passed 6 of 6 (2026-09-29): a race, so one green run proves little. 8-9 s wall
# at load 19-20, test_player_seek_present the long pole. It does NOT emulate CI's missing audio
# device (no local switch exists; tests/test_player_audio.py holds the stand-ins to every signal
# studio connects instead), nor its encoder: for exports the PACER_FFMPEG wrapper stands.
test-ciworld = { cmd = "ctest --test-dir build/Release --output-on-failure --timeout 480 -R '^(test_player_audio|test_player_seek_present|test_slider_release_lands)$'", depends-on = ["build"], env = { PACER_FOOTAGE_DEFAULTS = "off", QT_FFMPEG_DECODING_HW_DEVICE_TYPES = "none", CTEST_PARALLEL_LEVEL = "4" } }
# One-command core-math equivalence gate: the SYNTHETIC golden fingerprint (the CI half of the
# golden gate). Run after any Session/timing/geometry/delta change; expects EQUIVALENT.
golden = { cmd = "ctest --test-dir build/Release -R test_golden_synthetic --output-on-failure", depends-on = ["build"] }
# The truth test a visitor can run, no footage needed (README "Verify it yourself"): the REAL loader
# on a synthetic two-chapter GoPro with known truth, then the golden gate. The two files run
# directly, not under ctest, so their measurements print (ctest hides a pass); a test file run by
# hand is jailed already (studio/app_support.py), and the variable says so for both.
verify = { cmd = "python tests/test_synth_gopro.py && python tests/test_golden_synthetic.py", depends-on = ["build"], env = { PACER_APP_SUPPORT_JAIL = "1", QT_QPA_PLATFORM = "offscreen" } }
# The CI E2E gate as a task: build the whole StudioWindow offscreen on the bundled GoPro sample.
# NO PYTHONPATH, ON PURPOSE: the gate starts Python exactly as `studio` below does, so it fails
# whenever the README's command would. Until 2026-09-27 it set PYTHONPATH=bindings/pacer, the one
# thing `studio` lacked, and passed while `pixi run studio -- --demo` failed on every fresh clone:
# `import pacer` resolved to a namespace package with no Laps (EVAL-1). The build now deploys the
# whole package into site-packages (bindings/pacer/CMakeLists.txt), so no variable is needed; on
# main's tree this task without the override died with "module 'pacer' has no attribute 'Laps'".
smoke = { cmd = "python -m studio.dev._smoke --no-video", depends-on = ["build"] }
gen-bindings = "python bindings/pacer/generate-bindings.py"
studio = { cmd = "python -m studio", depends-on = ["build"] }
# The `--demo` recording (studio/dev/make_demo.py): a SYNTHETIC session — generated, not filmed —
# written to the new file named by `pixi run make-demo -- --out <file.mp4>`. numpy + the env's
# ffmpeg, so it needs no build; the release asset studio/demo.py pins is this command's output.
make-demo = "python -m studio.dev.make_demo"
# fmt excludes the litgen-GENERATED nanobind_pacer.cpp: the CI regen-drift gate
# requires it to match the generator's raw output byte-for-byte, so it must
# never be reformatted. fmt-check is the same file set, non-mutating (CI gate).
fmt = "git ls-files '*.cpp' '*.hpp' '*.h' '*.c' ':!bindings/pacer/nanobind_pacer.cpp' | xargs clang-format -i"
fmt-check = "git ls-files '*.cpp' '*.hpp' '*.h' '*.c' ':!bindings/pacer/nanobind_pacer.cpp' | xargs clang-format --dry-run --Werror"
lint = "ruff check ."
# pyright over the allow-list in pyrightconfig.json (the Qt-free core modules that pass; the ratchet
# is written there). No build needed: it reads the committed binding stubs. The env variable stops
# the conda `pyright` wrapper asking pypi.org for a newer version on every run: a gate makes no
# network call. Its pyright JS is bundled, and node comes from this env.
typecheck = { cmd = "pyright", env = { PYRIGHT_PYTHON_IGNORE_WARNINGS = "1" } }
# The release step's changelog fold (studio/dev/changelog.py). A dry run unless `--write`, which folds
# every changes/*.md into [Unreleased] and deletes them; `--write --release x.y.z` folds them under a
# new `## [x.y.z] — date` heading instead. Pure stdlib, so it needs no build.
changelog = "python -m studio.dev.changelog"

[tool.pixi.dependencies]
cmake = ">=4.0.2,<5"
scikit-build-core = ">=0.11.4,<0.12"
# Python and nanobind are held to their MINOR / MAJOR line until a deliberate upgrade PR: a routine
# `pixi update` would otherwise move python 3.13.5 -> 3.14.7 and nanobind 2.7.0 -> 3.1.0 (HEALTH-9,
# `pixi update --dry-run`, 2026-09-25) under a lock touched only to add a tool.
python = ">=3.13.5,<3.14"
catch2 = ">=3.15.0,<4"
ninja = ">=1.13.2,<2"
ruff = ">=0.15.16,<0.16"
clang-format = ">=22.1.7,<23"
ffmpeg = ">=7.1,<8"
# `pixi run typecheck`. Pinned EXACTLY: each pyright release adds checks, so a floating version
# could turn the gate red in a PR that changed no Python. Bump it in a PR of its own. It brings
# nodejs, nodeenv and setuptools into the env; nothing the .app bundles imports any of them.
pyright = "==1.1.414"
pytest = ">=9.1.1,<10"
